<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우쥬메리미 (WUMM) - 파트너 연동</title>

    <!-- Smart App Banner -->
    <meta name="apple-itunes-app" content="app-id=YOUR_APP_ID, app-argument=wumm://join?code=CODE_PLACEHOLDER">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #8e44ad 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .code-box {
            background: #f8f9fa;
            border: 2px dashed #e91e63;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .code-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .code {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 32px;
            font-weight: bold;
            color: #e91e63;
            letter-spacing: 4px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            color: white;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        .heart {
            color: #e91e63;
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #e91e63;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💒</div>
        <h1>우쥬메리미 웨딩플래너</h1>
        <p class="subtitle">파트너와 함께 웨딩 준비를 시작하세요!</p>

        <div class="code-box">
            <div class="code-label">파트너 연동 코드</div>
            <div class="code" id="partnerCode">------</div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: #666; font-size: 14px;">앱을 여는 중...</p>
        </div>

        <a href="#" class="btn btn-primary" id="openAppBtn" onclick="openApp()">
            📱 앱에서 열기
        </a>

        <a href="https://apps.apple.com/us/app/%EC%9A%B0%EC%A5%AC%EB%A9%94%EB%A6%AC%EB%AF%B8/id6757701074" class="btn btn-secondary" id="downloadBtn">
            ⬇️ 앱 다운로드
        </a>

        <div class="footer">
            <p>Made with <span class="heart">♥</span> for couples</p>
        </div>
    </div>

    <script>
        // URL에서 파트너 코드 추출
        function getPartnerCode() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('code') || '------';
        }

        // 파트너 코드 표시
        const code = getPartnerCode();
        document.getElementById('partnerCode').textContent = code;

        // 앱 URL 스킴
        const appScheme = 'wumm://join?code=' + code;

        // App Store URL (실제 앱 ID로 교체 필요)
        const appStoreUrl = 'https://apps.apple.com/us/app/%EC%9A%B0%EC%A5%AC%EB%A9%94%EB%A6%AC%EB%AF%B8/id6757701074';

        // 앱 열기 시도
        function openApp() {
            const loading = document.getElementById('loading');
            loading.classList.add('show');

            // 앱 스킴으로 열기 시도
            window.location.href = appScheme;

            // 2초 후에도 페이지에 있으면 앱이 설치되지 않은 것
            setTimeout(function() {
                loading.classList.remove('show');
                // 앱이 열리지 않으면 App Store로 이동할지 물어봄
                if (confirm('앱이 설치되어 있지 않습니다.\nApp Store에서 다운로드 하시겠습니까?')) {
                    window.location.href = appStoreUrl;
                }
            }, 2500);
        }

        // iOS에서 자동으로 앱 열기 시도 (선택적)
        // 페이지 로드 시 자동으로 앱 열기를 원하면 아래 주석 해제
        // window.onload = function() {
        //     setTimeout(openApp, 500);
        // };
    </script>
</body>
</html>
